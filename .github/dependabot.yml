# Dependabot version updates (SOC 2 SSDLC, qfg-66ko.3). Weekly; minor and
# patch bumps are grouped into one PR per ecosystem, majors stay separate.
# Security updates are enabled in the repo settings and are not grouped here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - ruby
    open-pull-requests-limit: 5
    groups:
      ruby-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Runtime dependencies of the published gem (gemspec add_dependency).
      # Our constraint is the floor customers must install, so a major bump
      # here forces every customer onto that major. Raise these floors
      # deliberately in a release, not via Dependabot.
      - dependency-name: "activesupport"
        update-types: ["version-update:semver-major"]
      - dependency-name: "concurrent-ruby"
        update-types: ["version-update:semver-major"]
      - dependency-name: "faraday"
        update-types: ["version-update:semver-major"]
      - dependency-name: "listen"
        update-types: ["version-update:semver-major"]
