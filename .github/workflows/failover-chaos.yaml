name: Failover Chaos

# Runs the failover + canonical-ordering chaos rigs (toxiproxy + the
# scenarios-failover/ and scenarios-ordering/ corpus from
# integration-test-data/chaos) against sdk-ruby. Jeff wants these running all the
# time, so this fires on every push to main + every PR alongside the existing
# Chaos workflow (chaos.yaml, single-upstream suite).
#
# Unlike chaos.yaml, the Ruby runner (chaos/failover_chaos.rb) spawns its own
# fixture upstream(s) — one upstream behind the primary+secondary proxies for
# failover, two upstreams at divergent Meta.generations for ordering — so this
# job only has to build api-delivery and boot toxiproxy via
# scripts/run-failover-chaos.sh. Wall clock ~3 min.
#
# Scenarios gated here: f01-f05 (failover) + o01-o05 (ordering). The
# parallel-failover hedge (qfg-7h5d.1.14) makes o01 (fast primary wins, secondary
# never contacted — cold standby), o03 (slow newer primary heals forward), and
# o05 (slow older primary loses to fast newer secondary) all green, so CHAOS_SKIP
# is now empty and the full ordering suite runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Nightly run on main (WS3.2, qfg-41nh.14): post-1.1.0 this suite is
    # otherwise dormant between SDK pushes while api-delivery keeps moving.
    # Cron times are staggered across the six backend SDK repos (06:10-07:25
    # UTC, 15 min apart) to be kind to shared runners and the toxiproxy image
    # pulls. Scheduled runs use repo-level secrets (QUONFIG_REPO_TOKEN is
    # repo-scoped), so the api-delivery checkout works here too. Failure
    # visibility relies on GitHub's default watcher-notification emails —
    # there is no Slack webhook wired into these repos yet.
    - cron: '55 6 * * *'

jobs:
  failover-chaos:
    name: Failover + Ordering Chaos
    # The "Checkout api-delivery" step needs secrets.QUONFIG_REPO_TOKEN to read
    # the private api-delivery repo. GitHub does NOT expose Actions secrets to
    # pull_request runs triggered by Dependabot, so the token resolves to an
    # empty string and checkout fails fast. Skip the job on Dependabot PRs — it
    # still runs in full on every push to main after merge.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Suite is ~3 min; cap at 30 to absorb warmup + the api-delivery build.
    # Scenarios fail fast inside the runner via their own wall_clock_seconds, so
    # this only kicks in if something hangs.
    timeout-minutes: 30
    steps:
      - name: Checkout sdk-ruby
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: sdk-ruby

      - name: Checkout integration-test-data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Kept equal to the unit/contract pin in test.yaml (qfg-goi1.1.3).
          # Carries the reframed o01 (fast primary wins; held==41,
          # resolvedFrom==primary, installCount==1), o05 (slow older primary
          # loses to fast newer secondary) and o03 (heal forward); no failover
          # or ordering scenario changed since v2026.06.19.1.
          # qfg-7h5d.1.14: the parallel-failover hedge makes these green.
          ref: v2026.10.03

      - name: Checkout api-delivery
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # api-delivery is private; the default GITHUB_TOKEN cannot read it. A
          # PAT or fine-grained token with read access must be configured as the
          # repo secret QUONFIG_REPO_TOKEN. The two rigs build api-delivery from
          # source (GOWORK=off) to spawn their fixture upstreams.
          repository: quonfig/api-delivery
          path: api-delivery
          ref: main
          token: ${{ secrets.QUONFIG_REPO_TOKEN }}

      # api-delivery tracks main on purpose (Decision 8, qfg-goi1.1.3): these
      # runs exist to catch api-delivery drift. Record the resolved SHA in the
      # run summary so a red run is reproducible.
      - name: Record api-delivery SHA
        run: |
          sha="$(git -C api-delivery rev-parse HEAD)"
          echo "api-delivery @ main resolved to ${sha}"
          echo "api-delivery: \`main\` @ \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.26'
          cache-dependency-path: api-delivery/go.sum

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8  # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: sdk-ruby

      - name: Verify docker compose available
        run: docker compose version

      - name: Run failover + ordering chaos rigs
        working-directory: sdk-ruby
        # CHAOS_SKIP is intentionally unset: the parallel-failover hedge
        # (qfg-7h5d.1.14) makes o01 + o03 + o05 green, so the FULL ordering suite
        # (o01-o05) and the failover suite (f01-f05) all run. run-failover-chaos.sh
        # has no built-in CHAOS_SKIP default, so an unset env var = no skip.
        run: ./scripts/run-failover-chaos.sh

      - name: Upload chaos logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: failover-chaos-logs-${{ github.run_id }}
          path: |
            sdk-ruby/.chaos-api-delivery
            sdk-ruby/chaos-*.log
          if-no-files-found: ignore
          retention-days: 7
